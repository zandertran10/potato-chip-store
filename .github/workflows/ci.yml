name: CI

# Runs lint and unit tests on every pull request, and on main after a merge.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "ruff>=0.6,<1" "pytest>=8,<9"

      - name: Lint
        run: ruff check .

      # Only unit tests run in CI: integration tests need a Supabase project
      # and keys, which CI does not have.
      # Exit code 5 means "no tests found". That is fine until Prompt F adds
      # the first tests, so we do not fail the build for it.
      - name: Unit tests
        run: python -m pytest tests/unit -q || [ $? -eq 5 ]
